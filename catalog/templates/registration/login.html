{% extends "catalog/base.html" %}

{% block title %}Log in - Reelflix{% endblock %}

{% block content %}
<h1 class="page-title">Log in</h1>
<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p class="auth-alt">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
{% endblock %}
