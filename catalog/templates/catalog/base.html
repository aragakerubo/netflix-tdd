{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Reelflix{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catalog/styles.css' %}">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="{% url 'catalog:home' %}">Reelflix</a>
        <form class="search" action="{% url 'catalog:home' %}" method="get" role="search">
            <input type="search" name="q" value="{{ query }}" placeholder="Search titles" aria-label="Search titles">
            <button type="submit">Search</button>
        </form>
        <nav class="user-nav">
            {% if user.is_authenticated %}
            <span class="user-name">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="logout">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a class="signup-link" href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
</body>

</html>
