databases:
  - name: reelflix-db
    databaseName: netflix
    user: netflix
    plan: free

services:
  - type: web
    name: reelflix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz/
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reelflix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DJANGO_PRODUCTION
        value: "1"
      - key: TMDB_API_KEY
        sync: false
