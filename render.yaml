# Render Blueprint: one Docker web service plus a managed Postgres.
# Create it from the Render dashboard with New > Blueprint, pointed at this repo.
databases:
  - name: reelflix-db
    databaseName: netflix
    user: netflix
    plan: free            # free Postgres expires after ~30 days; use a paid plan for real use

services:
  - type: web
    name: reelflix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # free web services sleep after inactivity; paid plans stay warm
    healthCheckPath: /healthz/
    # Migrations run in the Dockerfile CMD on container start, because Render's
    # preDeployCommand is not allowed on free-tier services. On a paid plan you
    # can remove the migrate from CMD and add: preDeployCommand: python manage.py migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reelflix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true       # Render mints a strong value
      - key: DEBUG
        value: "0"
      - key: DJANGO_PRODUCTION
        value: "1"
      - key: TMDB_API_KEY
        sync: false               # set this in the dashboard, not in the file
      # Seeding: free plans have no Shell, so seed at container start instead.
      # Set POPULATE_ON_START to "1" for one deploy to fill the catalog, then
      # set it back to "0" so it does not re-import on every cold start.
      - key: POPULATE_ON_START
        value: "0"
      - key: POPULATE_PAGES
        value: "3"
      - key: POPULATE_MEDIA
        value: "both"      # movie, tv, or both
