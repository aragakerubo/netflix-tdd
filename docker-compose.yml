services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netflix}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No literal default: this must be set in your gitignored .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Host port 5432 -> container 5432, so local pytest can reach it.
      # Change the left side (e.g. "5433:5432") if 5432 is already in use.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netflix}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  functional-tests:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-netflix}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
    volumes:
      - .:/app
    # Larger shared memory keeps Chromium from crashing under load.
    ipc: host
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
